/* =========================
   ELEMENTS
========================= */


const category =
document.getElementById("category");

const programme =
document.getElementById("programme");

const resultCard =
document.getElementById("resultCard");


/* =========================
   CATEGORY CHANGE
========================= */


category.addEventListener("change", function(){

    programme.innerHTML =
    '<option value="">Choose Programme</option>';

    resultCard.style.display = "none";


    if(this.value === ""){
        return;
    }


    programmes[this.value].forEach(function(item){

        const option =
        document.createElement("option");

        option.value = item;

        option.textContent = item;

        programme.appendChild(option);

    });

});


/* =========================
   PROGRAMME CHANGE
========================= */


programme.addEventListener("change", function(){

    if(this.value === ""){

        resultCard.style.display = "none";

        return;
    }


    resultCard.style.display = "block";


    document.getElementById("programTitle")
    .textContent = this.value;


    const categoryValue =
    category.value;


    const result =
    resultsData[categoryValue][this.value];


    if(!result){

        document.getElementById("firstName")
        .textContent = "Result Pending";

        document.getElementById("firstTeam")
        .textContent = "";

        document.getElementById("secondName")
        .textContent = "Result Pending";

        document.getElementById("secondTeam")
        .textContent = "";

        document.getElementById("thirdName")
        .textContent = "Result Pending";

        document.getElementById("thirdTeam")
        .textContent = "";

        return;
    }


    document.getElementById("firstName")
    .textContent =
    result.firstName || "Result Pending";


    document.getElementById("firstTeam")
    .textContent =
    result.firstTeam
    ? "Team: " + result.firstTeam
    : "";


    document.getElementById("secondName")
    .textContent =
    result.secondName || "Result Pending";


    document.getElementById("secondTeam")
    .textContent =
    result.secondTeam
    ? "Team: " + result.secondTeam
    : "";


    document.getElementById("thirdName")
    .textContent =
    result.thirdName || "Result Pending";


    document.getElementById("thirdTeam")
    .textContent =
    result.thirdTeam
    ? "Team: " + result.thirdTeam
    : "";

});


</script>
