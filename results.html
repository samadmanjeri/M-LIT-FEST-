<section>

<h2>Festival Results</h2>

<label>Select Category</label><br><br>

<select id="category">

<option value="">Choose Category</option>

<option value="junior">Junior</option>

<option value="senior">Senior</option>

<option value="general">General</option>

</select>

<br><br>

<label>Select Programme</label><br><br>

<select id="programme">

<option value="">Choose Programme</option>

</select>

<br><br>

<div id="resultCard" class="result-card" style="display:none;">

<h2 id="programTitle">

Select a Programme

</h2>

<hr>

<h3>🥇 First Prize</h3>

<p id="firstName">

Result Pending

</p>

<p id="firstTeam"></p>

<hr>

<h3>🥈 Second Prize</h3>

<p id="secondName">

Result Pending

</p>

<p id="secondTeam"></p>

<hr>

<h3>🥉 Third Prize</h3>

<p id="thirdName">

Result Pending

</p>

<p id="thirdTeam"></p>

</div>
<script>

const programmes = {

junior: [

"Memory Test",
"Story Writing",
"Essay Malayalam",
"Pencil Drawing",
"Water Colour Painting",
"Spelling Bee Arabic",
"Spelling Bee English",
"Caption Writing",
"Typing Malayalam",
"Typing Arabic",

"Hand Writing Arabic",

"Madh Song",
"Bhakthi Ganam",
"Elocution Malayalam",
"Qira'ath",
"Story Telling",
"Thadrees",
"Poem Recitation",
"Adan",
"Ganitha Keli",
"Quiz",
"Swarf Musabaqa",
"Reading English",
"Reading Arabic",
"Hifz"

],

senior: [
    "Future Writing",
"Story Writing",
"Essay Malayalam",
"Pencil Drawing",
"Slogan Writing",
"Typing Malayalam",
"Typing Arabic",
"Caption Writing",
"Social Tweet",
"Poem Making",
"e-Poster",
"Book Test",
"Hand Writing Malayalam",
"Hand Writing English",
"Hand Writing Arabic",

"Madh Song",

"Elocution Malayalam",

]

};

const category = document.getElementById("category");
const programme = document.getElementById("programme");

category.addEventListener("change", function(){

programme.innerHTML =
'<option value="">Choose Programme</option>';

if(this.value==="") return;

programmes[this.value].forEach(function(item){

programme.innerHTML += 
<option value="${item}">${item}</option>
;

});

});
    programme.addEventListener("change", function(){

if(this.value==""){
document.getElementById("resultCard").style.display="none";
return;
}

document.getElementById("resultCard").style.display="block";

document.getElementById("programTitle").innerHTML=this.value;

document.getElementById("firstName").innerHTML="Result Pending";
document.getElementById("firstTeam").innerHTML="";

document.getElementById("secondName").innerHTML="Result Pending";
document.getElementById("secondTeam").innerHTML="";

document.getElementById("thirdName").innerHTML="Result Pending";
document.getElementById("thirdTeam").innerHTML="";

});
